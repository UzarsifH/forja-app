name: Build Forja APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q forja-app-reviewed.zip
          cd forja-app
          echo "Project extracted successfully"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        working-directory: forja-app
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: forja-app
        run: npm run build

      - name: Create Android project
        working-directory: forja-app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: forja-app
        run: npx cap sync android

      - name: Build APK
        working-directory: forja-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forja-apk
          path: forja-app/android/app/build/outputs/apk/debug/app-debug.apk
